apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: hermes-agent
spec:
  replicas: 600  # ADR-002: Pod Pool size
  selector:
    matchLabels:
      app: hermes
      component: hermes-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50
      maxUnavailable: 0
  minReadySeconds: 30
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: hermes-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8642"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hermes-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      # ADR-002: Spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hermes
                    component: hermes-agent
                topologyKey: kubernetes.io/hostname
      # Init container creates user NAS directory
      initContainers:
        - name: init-nas-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Initializing NAS directory structure..."
              # Directory creation is handled by NFS provisioner
              # This init container validates NFS connectivity
              if [ ! -d "/nas/hermes-homes" ]; then
                echo "Warning: NAS path not accessible"
              fi
              echo "Init complete"
          volumeMounts:
            - name: nas-hermes-homes
              mountPath: /nas/hermes-homes
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        # Main Hermes Agent container (ADR-002)
        - name: hermes-agent
          image: hermes-agent:v1.0.0  # TODO: Replace with actual image
          imagePullPolicy: Always
          ports:
            - containerPort: 8642
              name: http
              protocol: TCP
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: HERMES_API_KEY
            - name: LOG_LEVEL
              value: "info"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LLM_PROVIDER
              value: "openai"
            - name: OPENAI_API_BASE
              value: "http://litellm-service.hermes-platform.svc.cluster.local:4000"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: LITELLM_MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8642
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nas-hermes-homes
              mountPath: /nas/hermes-homes
            - name: hermes-home
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: playwright-browsers
              mountPath: /opt/hermes/.playwright
        # Agent Sidecar container (ADR-002: Sidecar API)
        - name: agent-sidecar
          image: hermes-agent-sidecar:v1.0.0  # TODO: Replace with actual sidecar image
          imagePullPolicy: Always
          ports:
            - containerPort: 9080
              name: sidecar
              protocol: TCP
          env:
            - name: SIDECAR_PORT
              value: "9080"
            - name: HERMES_HOME_BASE
              value: /nas/hermes-homes
            - name: REDIS_HOST
              value: "redis.hermes-platform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nas-hermes-homes
              mountPath: /nas/hermes-homes
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nas-hermes-homes
          nfs:
            server: nfs.example.com  # TODO: Replace with actual NFS server
            path: /hermes-homes
        - name: hermes-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: playwright-browsers
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: hermes-agent
