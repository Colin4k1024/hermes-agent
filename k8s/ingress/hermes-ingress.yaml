apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes-platform
  labels:
    app: hermes
    tier: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hermes.example.com  # TODO: Replace with actual domain
      secretName: hermes-tls-secret
  rules:
    - host: hermes.example.com  # TODO: Replace with actual domain
      http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: router-service
                port:
                  number: 8002
          - path: /quota(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quota-service
                port:
                  number: 8003
          - path: /skills(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: skills-registry
                port:
                  number: 8004
          - path: /feishu(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: feishu-bot
                port:
                  number: 8005
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-console
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-tls-secret
  namespace: hermes-platform
  labels:
    app: hermes
type: kubernetes.io/tls
data:
  # TODO: Replace with actual TLS certificate and key (base64 encoded)
  # Use: cat cert.pem | base64 -w0
  tls.crt: REPLACE_WITH_BASE64_ENCODED_CERT
  tls.key: REPLACE_WITH_BASE64_ENCODED_KEY
