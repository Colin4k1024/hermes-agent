apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: database
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: database
    spec:
      serviceAccountName: db-migration-sa
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: db-migration
          image: hermes-db-migration:v1.0.0  # TODO: Replace with actual migration image
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              value: "postgres.hermes-platform.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "hermes"
            - name: POSTGRES_DB
              value: "hermes_platform"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: database
