apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: litellm-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hermes
      component: litellm-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: litellm-proxy
    spec:
      serviceAccountName: litellm-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hermes
                    component: litellm-proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: litellm-proxy
          image: ghcr.io/berriai/litellm:main-latest  # TODO: Use tagged release in production
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: litellm-cm
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: LITELLM_MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: tmp
          emptyDir: {}
        - name: litellm-config
          configMap:
            name: litellm-cm
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm-pdb
  namespace: hermes-platform
  labels:
    app: hermes
    component: litellm-proxy
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: hermes
      component: litellm-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: litellm-proxy
