apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-registry
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: skills-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
      component: skills-registry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: skills-registry
    spec:
      serviceAccountName: skills-registry-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hermes
                    component: skills-registry
                topologyKey: kubernetes.io/hostname
      containers:
        - name: skills-registry
          image: hermes-skills-registry:v1.0.0  # TODO: Replace with actual image
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: skills-registry-cm
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_PASSWORD
            - name: SKILLS_REGISTRY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: SKILLS_REGISTRY_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: ADMIN_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: org-skills
              mountPath: /nas/org-skills
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: org-skills
          nfs:
            server: nfs.example.com  # TODO: Replace with actual NFS server
            path: /hermes-homes/org-skills
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: skills-registry-pdb
  namespace: hermes-platform
  labels:
    app: hermes
    component: skills-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hermes
      component: skills-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skills-registry-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: skills-registry
