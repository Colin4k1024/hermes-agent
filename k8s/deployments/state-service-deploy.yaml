apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-service
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: state-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes
      component: state-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: state-service
    spec:
      serviceAccountName: state-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: state-service
          image: hermes-state-service:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: state-service-cm
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_PASSWORD
            - name: STATE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: INTERNAL_API_KEY
            - name: STATE_DATABASE_URL
              value: "postgresql+asyncpg://hermes:$(POSTGRES_PASSWORD)@postgres.hermes-platform.svc.cluster.local:5432/hermes_platform"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: state-service-pdb
  namespace: hermes-platform
  labels:
    app: hermes
    component: state-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hermes
      component: state-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: state-service-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: state-service
