apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hermes
      component: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hermes
        tier: backend
        component: auth-service
    spec:
      serviceAccountName: auth-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hermes
                    component: auth-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: auth-service
          image: hermes-auth-service:v1.0.0  # TODO: Replace with actual image
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auth-service-cm
            - secretRef:
                name: auth-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: OIDC_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: hermes-platform
  labels:
    app: hermes
    component: auth-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hermes
      component: auth-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: hermes-platform
  labels:
    app: hermes
    component: auth-service
