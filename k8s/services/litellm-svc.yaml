apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: litellm-proxy
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: hermes
    component: litellm-proxy
