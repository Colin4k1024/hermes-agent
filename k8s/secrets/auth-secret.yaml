apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: auth-service
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET_MIN_32_CHARS"
  OIDC_CLIENT_SECRET: "REPLACE_WITH_OIDC_CLIENT_SECRET"
  DATABASE_PASSWORD: "REPLACE_WITH_POSTGRES_PASSWORD"
