apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-secret
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: hermes-agent
type: Opaque
stringData:
  HERMES_API_KEY: "REPLACE_WITH_HERMES_API_KEY"
  LITELLM_MASTER_KEY: "REPLACE_WITH_LITELLM_MASTER_KEY"
  ADMIN_API_KEY: "REPLACE_WITH_ADMIN_API_KEY"
  INTERNAL_API_KEY: "REPLACE_WITH_INTERNAL_API_KEY"
  FEISHU_APP_ID: "REPLACE_WITH_FEISHU_APP_ID"
  FEISHU_APP_SECRET: "REPLACE_WITH_FEISHU_APP_SECRET"
