apiVersion: v1
kind: ConfigMap
metadata:
  name: router-service-cm
  namespace: hermes-platform
  labels:
    app: hermes
    tier: backend
    component: router-service
data:
  ROUTER_HOST: "0.0.0.0"
  ROUTER_PORT: "8002"
  ROUTER_DEBUG: "false"
  REDIS_HOST: "redis.hermes-platform.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  AUTH_SERVICE_URL: "http://auth-service.hermes-platform.svc.cluster.local:8001"
  QUOTA_SERVICE_URL: "http://quota-service.hermes-platform.svc.cluster.local:8003"
  ROUTER_POD_NAMESPACE: "hermes-platform"
  ROUTER_STATELESS_RUNTIME: "true"
  ROUTER_STATE_SERVICE_URL: "http://state-service.hermes-platform.svc.cluster.local:8006"
  LITELLM_PROXY_URL: "http://litellm-service.hermes-platform.svc.cluster.local:4000"
  HERMES_POD_BASE_URL: "http://hermes-agent-service.hermes-platform.svc.cluster.local:8642"
  K8S_ENABLED: "true"
  NAS_BASE_PATH: "/nas/hermes-homes"
  POD_IDLE_TTL_SECONDS: "1800"
  LOG_LEVEL: "info"
