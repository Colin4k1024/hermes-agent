[project]
name = "agent-router"
version = "0.1.0"
description = "Hermes Agent Router — FastAPI + Redis routing service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "redis[hiredis]>=5.2.0,<6",
    "httpx>=0.28.0,<1",
    "kubernetes>=28.0.0,<30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.3.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
