version: "3.9"
services:
  quota-service:
    build: .
    ports:
      - "8003:8003"
    environment:
      - QUOTA_DEBUG=true
      - QUOTA_POSTGRES_HOST=postgres
      - QUOTA_REDIS_HOST=redis
      - QUOTA_ADMIN_API_KEY=dev-admin-key-change-in-prod
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes_quota
    ports:
      - "5433:5432"
    volumes:
      - pg_quota_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no

volumes:
  pg_quota_data:
